BB_CONF_FRAGMENT_SUMMARY = "Doorphone configuration with RAUC support"
BB_CONF_FRAGMENT_DESCRIPTION = "Configuration for SIP doorphone with RAUC A/B update support, U-Boot bootloader, and optimized settings for Raspberry Pi"

QB_MEM = "-m 2048"
BOOT_SPACE = "69152"

# we are read only, no addition space necessary, except for rauc
IMAGE_OVERHEAD_FACTOR = "1.1"

BOOT_SPACE = "69152"

DISTRO_FEATURES:append = " rauc"

# we do not use bluetooth at the moment
DISTRO_FEATURES:remove = " bluetooth"

# this is required for UBoot
ENABLE_UART = "1"

RPI_USE_U_BOOT = "1"

# PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
WKS_FILE = "${THISDIR}/wic/sdimage-doorphone_partition.wks.in"

# Settings for meta-rauc-raspberry-pi
IMAGE_FSTYPES = "ext4 wic.bz2 wic"
IMAGE_INSTALL:append = " rauc"

# if not set, you will have to take care of mount points at two places, with this set image
# partition layout is done in wic file and fstab settings in aws-iot-lite-demo-ab-image.bb
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"

# we do not want to have ptests in demo images enabled
DISTRO_FEATURES:remove = "ptest"

LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# Disable SPDX generation for qa issues (TODO;)
INHERIT:remove = "create-spdx"
ERROR_QA:remove = "obsolete-license"
ERROR_QA:remove = "file-rdeps"

# meta-bc predates wrynose and still declares LicenseRef-BSD / LicenseRef-LGPL
# on openh264, speex-bc, srtp-bc and spandsp. oe-core now treats a LICENSE
# reference with no matching generic_* license file as a fatal QA error, which
# halts parsing outright. Demote it to a warning rather than inventing license
# text for those refs; revisit when meta-bc moves to wrynose and fixes them.
ERROR_QA:remove = "license-format"



# TODO this is not working?
# this will enable camera v3 support (bcm2835-unicam)
# RASPBERRYPI_CAMERA_V3 = "1"
# RASPBERRYPI_CAMERA_V2 = "1"

# Pin the kernel to 6.12. The doorphone uses the legacy MMAL camera stack
# (start_x=1 + bcm2835-v4l2), and on 6.18 the kernel cannot create the firmware's
# camera component at all: VIDIOC_S_FMT fails with EINVAL for every resolution,
# accompanied by "bcm2835_mmal_vchiq: timed out waiting for sync completion" and
# "vidioc_s_fmt_vid_cap: failed to setup mmal components: -62". 6.12.41 drove the
# same camera fine.
#
# Verified NOT to be the cause before landing here: gpu_mem (firmware already
# gives 128M with start_x=1), kernel CMA (raised 5MiB -> 256MiB, no change), and
# kernel/firmware skew (firmware updated 20250801 -> 20260521, no change).
# "vcgencmd get_camera" reports supported=1 detected=1 throughout, so the sensor
# and its ribbon are fine.
#
# meta-raspberrypi's own conf/machine/raspberrypi4.conf pins 6.12.% too, though
# for an unrelated reason (6.18 dropped the 32-bit config for rpi4). Our machine
# is raspberrypi-armv8, which defaults to 6.18.%, so we set it explicitly.
#
# Revisit when moving to libcamera, which is the supported path for camera
# capture on current kernels.
PREFERRED_VERSION_linux-raspberrypi = "6.12.%"

VIDEO_CAMERA = "1"

# disable onboard audio
ENABLE_AUDIO = "0"
