# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*/*.bb \
            ${LAYERDIR}/recipes*/*/*.bbappend \
            ${LAYERDIR}/recipes*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "doorphone"
BBFILE_PATTERN_doorphone := "^${LAYERDIR}/"
BBFILE_PRIORITY_doorphone = "100"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_doorphone = "1"

LAYERDEPENDS_doorphone = "core"
LAYERDEPENDS_doorphone += "openembedded-layer"
LAYERDEPENDS_doorphone += "meta-python"
LAYERDEPENDS_doorphone += "multimedia-layer"
LAYERDEPENDS_doorphone += "raspberrypi"
LAYERDEPENDS_doorphone += "rauc"
LAYERDEPENDS_doorphone += "meta-rauc-raspberrypi"

LAYERSERIES_COMPAT_doorphone = "wrynose"

LICENSE_PATH += "${LAYERDIR}/licenses"

# --- Release-series bridge ---------------------------------------------------
# oe-core sets LAYERSERIES_CORENAMES = "wrynose blacksail", so every layer must
# declare one of those two. One layer in this stack still declares only
# whinlatter and would abort the parse:
#
#   bc   (linphone/belle-sip - required by the doorphone, no wrynose yet)
#
# bitbake collects LAYERSERIES_COMPAT_* while parsing layer.conf files and
# checks them BEFORE local.conf or any config fragment is read, so this cannot
# live in conf/fragments/doorphone.conf - it only works from a layer.conf that
# is parsed after theirs. meta-doorphone is last in BBLAYERS, so here it is.
#
# Drop this as soon as meta-bc declares wrynose upstream; it asserts a
# compatibility we have verified only by building, not by any upstream
# statement. (de.ensc.bpi-router and meta-de.sigma-chemnitz needed the same
# bridge and were dropped from the config instead - nothing depended on them,
# and bpi-router additionally still keeps its wic files in the pre-wrynose
# scripts/lib/wic/canned-wks location, which oe-core now rejects.)
LAYERSERIES_COMPAT_bc = "wrynose"

# meta-bc's corretto-11-bin-native requires a meta-aws recipe file by exact
# version and no longer resolves; recipes-devtools/amazon-corretto in this layer
# provides the same recipe against the version meta-aws currently ships.
BBMASK += "meta-bc/recipes-devtools/amazon-corretto/corretto-11-bin-native_11.0.29.7.1.bb"

# meta-bc's linphone-sdk recipes DEPEND on yasm-native, which oe-core has since
# dropped (nothing in any layer provides it now), so they are unbuildable. They
# are also unused: the doorphone links the individual linphone/belle-sip/belr
# recipes, not the SDK. bitbake copes by pruning the target and carrying on, but
# it still logs
#
#   Nothing PROVIDES 'yasm-native' (but linphone-sdk_latest.bb DEPENDS on it)
#   Nothing RPROVIDES 'linphone-sdk'
#
# as ERRORs and exits non-zero even when every task succeeded. Mask them so a
# successful build actually reports success.
BBMASK += "meta-bc/recipes-bc/linphone-sdk/"
